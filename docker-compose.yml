# docker-sync 本地部署示例
#
# 用法：
#   mkdir -p data
#   # Linux/macOS 首次运行时，让容器内的非 root 用户（UID 10001）可写绑定目录：
#   sudo chown -R 10001:10001 data
#   docker compose up -d --build
#   # 打开 http://localhost:8080
#
# 注意：这是纯本地/内网工具，服务本身没有鉴权，不要直接暴露到公网。

name: docker-sync

services:
  docker-sync:
    build:
      context: .
      dockerfile: Dockerfile
      # 基础镜像与依赖源可用环境变量指向镜像站（无法直连 Docker Hub 时）：
      #   GO_IMAGE=docker.m.daocloud.io/library/golang:1.25-alpine \
      #   RUNTIME_IMAGE=docker.m.daocloud.io/library/alpine:3.22 \
      #   APK_MIRROR=https://mirrors.aliyun.com/alpine \
      #   docker compose up -d --build
      args:
        GO_IMAGE: "${GO_IMAGE:-docker.io/library/golang:1.25-alpine}"
        RUNTIME_IMAGE: "${RUNTIME_IMAGE:-docker.io/library/alpine:3.22}"
        GOPROXY: "${GOPROXY:-https://proxy.golang.org,direct}"
        APK_MIRROR: "${APK_MIRROR:-}"
        # 可选：覆盖镜像内注入的版本号与提交号，例如
        #   VERSION=0.1.2 COMMIT=$(git rev-parse --short HEAD) docker compose up -d --build
        VERSION: "${VERSION:-0.1.0}"
        COMMIT: "${COMMIT:-}"
    image: docker-sync:local
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    restart: unless-stopped
    # 让 SIGTERM 有足够时间完成优雅关闭（服务内部最多等待 30s）。
    stop_grace_period: 40s
    environment:
      # 想让 docker 客户端走 HTTPS（不必改 daemon.json）时，开启内置自签证书：
      # 客户端只需把 http://<本机>:8080/api/mirror/ca.crt 下载后放到
      # /etc/docker/certs.d/<本机IP:8080>/ca.crt（Docker Desktop：~/.docker/certs.d/…），
      # 然后 restart docker。证书会自动包含本机所有网卡地址，换 IP 会自动重签。
      TLS_MODE: "${TLS_MODE:-off}"        # off | self-signed | files
      # TLS_CERT: "/data/tls/company.pem"  # TLS_MODE=files 时必填
      # TLS_KEY: "/data/tls/company.key"
      # TLS_HOSTS: "mirror.corp.local"     # 追加进自签证书的域名，逗号分隔
      # TLS_DIR: "/data/tls"               # 自签证书存放目录，默认 <data>/tls
      TZ: "Asia/Shanghai"        # cron 表达式按此本地时区解释
    # 注意：TLS_MODE 只能通过 environment 传入（Dockerfile 的 CMD 只给了 -addr/-data）。
    # healthcheck 已由镜像内置（GET /api/health），HTTP/HTTPS 都会自动探测。
