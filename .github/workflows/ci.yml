name: ci

# 普通提交与 PR 的快速回归：格式、静态检查、单测、三平台编译（不发布）。
on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

jobs:
  check:
    name: 检查与测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt 检查
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "以下文件未通过 gofmt："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: |
          set -o pipefail
          go test ./... -count=1 2>&1 | tee /tmp/test.log

      - name: 测试失败详情
        if: failure()
        run: |
          echo '### go test 输出（末尾 120 行）' >> "$GITHUB_STEP_SUMMARY"
          echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          tail -n 120 /tmp/test.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '~~~' >> "$GITHUB_STEP_SUMMARY"

  build:
    name: 编译 ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 编译
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          go build -trimpath -ldflags "-s -w" -o /tmp/docker-sync ./cmd/server
          file /tmp/docker-sync
